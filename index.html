<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Trader</title>
<meta name="description" content="Build a real fantasy roster, propose a trade, and get a starting-lineup-based grade for both sides. Rest-of-season player values, updated weekly.">
<meta property="og:title" content="Fantasy Trader">
<meta property="og:description" content="Build a real fantasy roster, propose a trade, and get a starting-lineup-based grade for both sides.">
<meta property="og:image" content="https://fantasytrader.online/hero.jpg">
<meta property="og:url" content="https://fantasytrader.online/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fantasy Trader">
<meta name="twitter:description" content="Build a real fantasy roster, propose a trade, and get a starting-lineup-based grade for both sides.">
<meta name="twitter:image" content="https://fantasytrader.online/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as app/draft_board.html, so this reads as the same tool family. */
  :root{
    --bg: #10201A;
    --panel: #17281F;
    --panel-raised: #1D3327;
    --line: rgba(245,243,234,0.10);
    --line-strong: rgba(245,243,234,0.22);
    --chalk: #F5F3EA;
    --chalk-dim: #B9C4B9;
    --chalk-faint: #7C897E;
    --yard: #4C9A63;
    --qb: #D9822B;
    --qb-bg: #3A2A16;
    --rb: #4E8FD1;
    --rb-bg: #14263B;
    --wr: #4FAE6E;
    --wr-bg: #123322;
    --te: #A582D6;
    --te-bg: #241A3B;
    --bad: #D9756A;
    --bad-bg: #3B1F1B;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(245,243,234,0.025) 0px, rgba(245,243,234,0.025) 1px, transparent 1px, transparent 64px);
    color: var(--chalk);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }
  .wrap{ max-width: 920px; margin: 0 auto; padding: 28px 18px 60px; }

  .version-badge{
    position:fixed; top:10px; right:12px; z-index:50;
    background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:8px;
    padding:4px 9px; font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:600;
    color: var(--chalk-faint); letter-spacing:0.5px;
  }

  /* Hero banner: hero.jpg (2400x1260, an SVG illustration of two roster cards with a trade
     arrow between them -- same visual language as the app's own roster-row/grade-card
     components) sits full-bleed above the wrap as a plain image strip, with the masthead text
     flowing in normal document order right below it -- deliberately NOT an overlaid-text-on-image
     treatment. That was tried first and dropped: which vertical slice of a fixed-aspect image
     ends up visible under object-fit:cover depends continuously on the container's own aspect
     ratio, which changes with viewport width -- there's no single crop/overlay-height pairing
     that stays clear of the artwork at every width from a phone up through a wide desktop
     window. Stacking the two removes the interaction entirely: the image crops however it
     crops, the text always has its own clear space, at any width. */
  .hero-banner{ width:100%; background: var(--bg); }
  .hero-banner img{
    display:block; width:100%; height:220px; object-fit:cover; object-position:center;
  }
  .hero-caption{ max-width:920px; margin:0 auto; padding:18px 18px 0; }
  .hero-caption h1{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:26px; letter-spacing:0.5px;
    text-transform: uppercase; margin:0 0 4px; color: var(--chalk);
  }
  .hero-caption p{ margin:0; color: var(--chalk-dim); font-size:13px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--yard); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }

  .reset-btn{
    background: var(--panel); border:0.5px solid var(--line-strong); border-radius:10px;
    color: var(--chalk); padding:11px 16px; font-size:13px; font-weight:500; cursor:pointer;
    font-family:'Inter', sans-serif; white-space:nowrap;
  }
  .reset-btn:hover{ background: var(--panel-raised); border-color: var(--chalk-faint); }
  .reset-btn:active{ transform: scale(0.98); }
  .reset-btn.small{ padding:6px 11px; font-size:12px; }
  .reset-btn.primary{ border-color: var(--yard); color: var(--yard); }

  select{
    background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:10px;
    color: var(--chalk); padding:9px 12px; font-size:13px; font-family:'Inter', sans-serif; cursor:pointer;
  }
  select:focus{ outline:none; border-color: var(--yard); }

  /* ---- League bar + new-league form ---- */
  .league-bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .league-bar select{ flex:1; min-width:160px; }
  .storage-warn{ font-size:11px; color: var(--bad); width:100%; }
  .new-league-form{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; background: var(--panel);
    border:0.5px solid var(--line-strong); border-radius:10px; padding:10px; margin-bottom:14px;
  }
  .new-league-form input[type=text]{
    flex:1; min-width:140px; background: var(--panel-raised); border:0.5px solid var(--line-strong);
    border-radius:8px; padding:9px 11px; color: var(--chalk); font-size:13px; font-family:'Inter', sans-serif;
  }
  .new-league-form input[type=text]:focus{ outline:none; border-color: var(--yard); }

  .league-hint{ font-size:11.5px; color: var(--chalk-faint); margin-bottom:16px; line-height:1.5; }

  /* ---- Import league: Sleeper / ESPN bookmarklet / raw JSON ---- */
  .import-panel{
    background: var(--panel); border:0.5px solid var(--line-strong); border-radius:10px;
    padding:14px; margin-bottom:14px; display:flex; flex-direction:column; gap:16px;
  }
  .import-section-title{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; text-transform:uppercase;
    letter-spacing:0.5px; color: var(--chalk-dim); margin-bottom:6px;
  }
  .import-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .import-row input[type=text]{
    flex:1; min-width:180px; background: var(--panel-raised); border:0.5px solid var(--line-strong);
    border-radius:8px; padding:9px 11px; color: var(--chalk); font-size:13px; font-family:'Inter', sans-serif;
  }
  .import-row input[type=text]:focus{ outline:none; border-color: var(--yard); }
  .import-error{ color: var(--bad); font-size:11.5px; margin-top:6px; }
  .import-json-area{
    width:100%; background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:8px;
    color: var(--chalk); font-family:'JetBrains Mono', monospace; font-size:12px; padding:9px 11px;
  }
  .bookmarklet-btn{
    display:inline-block; background: var(--yard); color: var(--bg); font-weight:600; font-size:13px;
    padding:9px 16px; border-radius:8px; text-decoration:none; cursor:grab; white-space:nowrap;
  }
  .bookmarklet-btn:active{ cursor:grabbing; }
  .import-steps{ margin:8px 0 0; padding-left:18px; color: var(--chalk-faint); font-size:11.5px; line-height:1.9; }
  .import-steps li{ margin-bottom:2px; }

  .pending-import-banner{
    background: var(--panel-raised); border:1px solid var(--yard); border-radius:10px;
    padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .pending-import-banner .pib-text{ flex:1; min-width:200px; font-size:13px; color: var(--chalk); }
  .pending-import-banner .pib-text b{ color: var(--yard); }

  .team-select-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .team-select-row label{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:4px; font-size:11px; color: var(--chalk-faint); text-transform:uppercase; letter-spacing:0.5px; }
  .team-select-row select{ width:100%; }

  .teams-grid{ display:flex; flex-direction:column; gap:16px; margin-bottom:20px; }
  @media (min-width: 760px){
    .teams-grid{ flex-direction:row; align-items:flex-start; }
    .team-panel{ flex:1; min-width:0; }
  }

  .team-panel{
    background: var(--panel); border:0.5px solid var(--line-strong); border-radius:14px;
    padding:16px;
  }
  .team-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .team-name-input{
    flex:1; min-width:0; background: transparent; border:none; border-bottom:1px solid var(--line-strong);
    color: var(--chalk); font-family:'Oswald', sans-serif; font-weight:600; font-size:18px;
    text-transform:uppercase; letter-spacing:0.4px; padding:4px 2px;
  }
  .team-name-input:focus{ outline:none; border-color: var(--yard); }
  .lineup-par{
    font-family:'JetBrains Mono', monospace; font-size:13px; color: var(--chalk-dim);
    background: var(--panel-raised); border-radius:8px; padding:5px 10px; white-space:nowrap;
  }
  .lineup-par b{ color: var(--chalk); }

  .search-box{ position:relative; margin-bottom:10px; }
  .search-box input{
    width:100%; background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:10px;
    padding:10px 12px 10px 36px; color: var(--chalk); font-size:14px; font-family:'Inter', sans-serif;
  }
  .search-box input:focus{ outline:none; border-color: var(--yard); box-shadow: 0 0 0 3px rgba(76,154,99,0.18); }
  .search-box input::placeholder{ color: var(--chalk-faint); }
  .search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color: var(--chalk-faint); font-size:14px; pointer-events:none; }
  .search-results{
    position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20;
    background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:10px;
    max-height:260px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .search-result{
    display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer;
    border-bottom:0.5px solid var(--line);
  }
  .search-result:last-child{ border-bottom:none; }
  .search-result:hover{ background: rgba(245,243,234,0.06); }
  .search-empty{ padding:10px; color: var(--chalk-faint); font-size:12px; }

  .posrank{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:600; min-width:38px; text-align:center;
    padding:3px 0; border-radius:6px; flex-shrink:0;
  }
  .posrank.QB{ color: var(--qb); background: var(--qb-bg); }
  .posrank.RB{ color: var(--rb); background: var(--rb-bg); }
  .posrank.WR{ color: var(--wr); background: var(--wr-bg); }
  .posrank.TE{ color: var(--te); background: var(--te-bg); }
  .posrank.unk{ color: var(--chalk-faint); background: rgba(245,243,234,0.06); }

  .roster-list{ display:flex; flex-direction:column; gap:5px; }
  .roster-row{
    display:flex; align-items:center; gap:9px; background: var(--panel-raised);
    border:0.5px solid var(--line); border-radius:9px; padding:8px 9px;
  }
  .roster-row.marked{ border-color: var(--yard); background: rgba(76,154,99,0.10); }
  .roster-meta{ flex:1; min-width:0; }
  .roster-name{ font-size:13.5px; font-weight:500; color: var(--chalk); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roster-team{ font-size:11px; color: var(--chalk-faint); margin-top:1px; }
  .roster-nums{ text-align:right; flex-shrink:0; min-width:44px; }
  .roster-par{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600; color: var(--chalk); }
  .roster-parlabel{ font-size:9px; color: var(--chalk-faint); }
  .send-toggle{
    flex-shrink:0; width:30px; height:30px; border-radius:8px; border:0.5px solid var(--line-strong);
    background:transparent; color: var(--chalk-faint); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .send-toggle.on{ background: var(--yard); border-color: var(--yard); color: var(--bg); }
  .remove-btn{
    flex-shrink:0; width:22px; height:22px; border-radius:6px; border:none; background:transparent;
    color: var(--chalk-faint); cursor:pointer; font-size:14px; line-height:1;
  }
  .remove-btn:hover{ color: var(--bad); }
  .roster-empty{ text-align:center; padding:18px 10px; color: var(--chalk-faint); font-size:12px; }

  .summary-panel{
    background: var(--panel); border:0.5px solid var(--line-strong); border-radius:14px; padding:18px;
    margin-bottom:20px;
  }
  .summary-title{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:16px; text-transform:uppercase;
    letter-spacing:0.5px; margin:0 0 14px;
  }
  .summary-empty{ text-align:center; padding:30px 10px; color: var(--chalk-faint); font-size:13px; }
  .summary-empty .big{ font-family:'Oswald', sans-serif; font-size:16px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }

  .grade-grid{ display:flex; flex-direction:column; gap:14px; }
  @media (min-width: 760px){ .grade-grid{ flex-direction:row; } }
  .grade-card{
    flex:1; background: var(--panel-raised); border:0.5px solid var(--line-strong); border-radius:12px;
    padding:14px; display:flex; gap:14px; align-items:flex-start;
  }
  .grade-badge{
    flex-shrink:0; width:56px; height:56px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-family:'Oswald', sans-serif; font-weight:600; font-size:22px;
  }
  .grade-badge.small{ width:38px; height:38px; font-size:15px; border-radius:9px; }
  .grade-badge.g-a{ background: var(--wr-bg); color: var(--wr); }
  .grade-badge.g-b{ background: var(--rb-bg); color: var(--rb); }
  .grade-badge.g-c{ background: var(--qb-bg); color: var(--qb); }
  .grade-badge.g-d, .grade-badge.g-f{ background: var(--bad-bg); color: var(--bad); }

  .grade-body{ flex:1; min-width:0; }
  .grade-team{ font-family:'Oswald', sans-serif; font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
  .grade-line{ font-size:12px; color: var(--chalk-dim); margin-bottom:3px; }
  .grade-line b{ color: var(--chalk); font-family:'JetBrains Mono', monospace; }
  .grade-players{ font-size:11.5px; color: var(--chalk-faint); margin-top:8px; line-height:1.5; }
  .grade-players b{ color: var(--chalk-dim); }
  .apply-row{ margin-top:14px; text-align:right; }

  .methodology{
    margin-top:16px; font-size:11px; color: var(--chalk-faint); line-height:1.6;
    border-top:0.5px solid var(--line); padding-top:12px;
  }
  .methodology b{ color: var(--chalk-dim); }
  .methodology p{ margin:0 0 8px; }
  .methodology p:last-child{ margin-bottom:0; }

  /* ---- Recommendations ---- */
  .rec-panel{
    background: var(--panel); border:0.5px solid var(--line-strong); border-radius:14px; padding:18px;
    margin-bottom:20px;
  }
  .rec-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .rec-focus-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .rec-focus-row label{ font-size:11px; color: var(--chalk-faint); text-transform:uppercase; letter-spacing:0.5px; }
  .rec-focus-row select{ min-width:200px; }
  .rec-hint{ font-size:11.5px; color: var(--chalk-faint); margin-bottom:12px; line-height:1.5; }
  .rec-card{
    display:flex; align-items:center; gap:12px; background: var(--panel-raised);
    border:0.5px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; flex-wrap:wrap;
  }
  .rec-card-head{ display:flex; align-items:center; gap:10px; flex:1; min-width:220px; }
  .rec-opp{ font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:2px; }
  .rec-lines{ font-size:11.5px; color: var(--chalk-dim); line-height:1.5; }
  .rec-lines b{ color: var(--chalk); font-family:'JetBrains Mono', monospace; }

  @media (max-width: 420px){
    .hero-banner img{ height:150px; }
    .hero-caption h1{ font-size:22px; }
    .grade-badge{ width:46px; height:46px; font-size:18px; }

    /* Same fix the Draft Board already applies at this width (HANDOFF.md sec 7): a roster row
       has too many fixed-width columns (rank badge, PAR, two buttons) to also ellipsis a full
       name down to a few characters and still be readable -- shrink the fixed columns and let
       the name wrap to a second line instead of truncating. */
    .team-panel{ padding:12px; }
    .roster-row{ gap:6px; padding:7px 8px; }
    .roster-name{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.25; }
    .posrank{ min-width:30px; font-size:9px; }
    .roster-nums{ min-width:38px; }
    .roster-par{ font-size:12px; }
    .send-toggle{ width:26px; height:26px; }
    .remove-btn{ width:18px; height:18px; }
  }
</style>
</head>
<body>
<div class="version-badge">RoS v2</div>

<div class="hero-banner">
  <img src="hero.jpg" alt="Two roster cards connected by a trade arrow">
</div>
<div class="hero-caption">
  <div class="eyebrow">2026 &middot; Rest-of-season value &middot; regenerate weekly</div>
  <h1>Fantasy Trader</h1>
  <p id="subtitle">Add the players changing hands for an instant value-for-value grade, or import a full league for starting-lineup-based grades and trade recommendations.</p>
</div>

<div class="wrap">

  <div id="pendingImportBanner"></div>

  <div id="leagueBar"></div>

  <div id="teamSelectors"></div>

  <div class="teams-grid">
    <div class="team-panel" id="panelA"></div>
    <div class="team-panel" id="panelB"></div>
  </div>

  <div class="summary-panel">
    <div class="summary-title">Trade grade</div>
    <div id="summaryOut"></div>
    <div class="methodology" id="methodology"></div>
  </div>

  <div id="recPanel"></div>

</div>

<script>

// ---- League roster construction (HANDOFF.md sec 1: 1QB/2RB/2WR/1TE/2FLEX) drives the
// "optimal starting lineup" calculation both the grade and the recommendation engine fold
// into -- see the methodology note rendered at the bottom of the page for the full reasoning. ----
const STARTER_SLOTS = { QB:1, RB:2, WR:2, TE:1 };
const FLEX_COUNT = 2;
// A required starting slot with nobody in it is worse than literally any real player at that
// position (even a deep replacement-level one, whose ros_par floors near/at 0) -- this constant
// makes an empty required slot score clearly worse than the worst realistic real starter, so the
// lineup-impact metric doesn't quietly reward leaving a roster slot empty during entry.
const NO_STARTER_PENALTY = -150;

function optimalLineupPAR(roster){
  const byPos = { QB:[], RB:[], WR:[], TE:[] };
  roster.forEach(p => { if (byPos[p.pos]) byPos[p.pos].push(p.ros_par); });
  Object.values(byPos).forEach(a => a.sort((x,y) => y-x));
  let total = 0;
  const leftover = { RB:[], WR:[], TE:[] };
  ['QB','RB','WR','TE'].forEach(pos => {
    const need = STARTER_SLOTS[pos];
    const arr = byPos[pos];
    for (let i=0; i<need; i++) total += (i < arr.length) ? arr[i] : NO_STARTER_PENALTY;
    if (pos !== 'QB') leftover[pos] = arr.slice(need);
  });
  const flexPool = [...leftover.RB, ...leftover.WR, ...leftover.TE].sort((a,b) => b-a);
  for (let i=0; i<FLEX_COUNT; i++) total += (i < flexPool.length) ? flexPool[i] : 0;
  return Math.round(total);
}

// ---- Trade grade bands, in "optimal-starting-lineup rest-of-season PAR points gained/lost."
// Calibrated (not backtested -- there's no real "graded trades vs. real outcomes" dataset to
// validate against, same documented-assumption spirit as blend.py's judgment-source weighting,
// see HANDOFF.md) against this pool's own PAR spread: top rest-of-season players sit
// ~150-220 PAR above replacement, so a genuine one-for-one star-level upgrade can easily swing
// a lineup by double digits -- these bands are sized to that range. ----
const GRADE_BANDS = [
  { min: 30,        grade: 'A+', cls: 'g-a' },
  { min: 18,        grade: 'A',  cls: 'g-a' },
  { min: 10,        grade: 'A-', cls: 'g-a' },
  { min: 4,         grade: 'B+', cls: 'g-b' },
  { min: 1,         grade: 'B',  cls: 'g-b' },
  { min: -1,        grade: 'B-', cls: 'g-b' },
  { min: -4,        grade: 'C+', cls: 'g-c' },
  { min: -10,       grade: 'C',  cls: 'g-c' },
  { min: -18,       grade: 'C-', cls: 'g-c' },
  { min: -30,       grade: 'D',  cls: 'g-d' },
  { min: -Infinity, grade: 'F',  cls: 'g-f' },
];
function gradeFor(delta){
  for (const b of GRADE_BANDS) if (delta >= b.min) return b;
  return GRADE_BANDS[GRADE_BANDS.length-1];
}

// =========================================================================================
// Leagues: persisted, multi-team (10 or 12) rosters you build up once and reuse across many
// trade evaluations. Saved to localStorage, scoped per browser -- deliberate, not a fallback:
// this is a public site (fantasytrader.online) with no accounts, so "each visitor only sees
// their own leagues" is enforced simply by nobody's data ever leaving their own browser. A
// server-side store shared across visitors was considered and rejected for exactly that reason
// -- it would need real accounts/auth to keep people's leagues apart, which wasn't wanted for
// v1. A special, never-saved "scratch" league keeps the original two-panel quick-trade behavior
// (no setup required, no persistence) alongside real leagues, so the tool still works with zero
// setup the first time a new visitor opens it.
// =========================================================================================
const LS_KEY = 'trade_analyzer_leagues_v1';
let storageOK = true;

function loadSavedLeagues(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e){ storageOK = false; return []; }
}
function persistLeagues(){
  if (!storageOK) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(leagues.filter(l => l.id !== 'scratch'))); }
  catch (e){ storageOK = false; }
}

function currentTeam(side){ return teamById(activeLeague(), side === 'A' ? teamAId : teamBId); }

// A saved roster only stores player NAMES (compact, and the source of truth for pos/value stays
// the injected ROS_PLAYERS pool) -- hydrate() resolves those names against POOL_BY_NAME for
// rendering/scoring. A name that no longer matches the current pool (e.g. dropped in a refresh,
// or a typo) still renders instead of silently vanishing -- flagged as "unknown" with 0 PAR
// rather than crashing or hiding real roster data.
function hydrate(names){
  return names.map(n => {
    const p = POOL_BY_NAME.get(n);
    return p ? { ...p } : { name:n, pos:'?', team:'', ros_proj:0, ros_par:0, games_played:0, games_remaining:17, unknown:true };
  });
}

function createLeague(name, teamCount){
  const id = 'lg_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const teams = [];
  for (let i=1; i<=teamCount; i++) teams.push({ id:'t'+i, name:'Team '+i, roster:[] });
  const league = { id, name: (name && name.trim()) || ('League ' + (leagues.length)), teamCount, teams };
  leagues.push(league);
  persistLeagues();
  activeLeagueId = id;
  teamAId = teams[0].id; teamBId = teams[1].id;
  resetTradeState();
  newLeagueForm = false;
}
// Import a league from an external source (e.g. a real ESPN/Sleeper/Yahoo league) as plain JSON:
// { "name": "League Name", "teams": [ { "name": "Team Name", "roster": ["Player Name", ...] }, ... ] }
// Player names should match this pool's naming convention (POOL_BY_NAME) where possible --
// anything that doesn't match still imports fine, just renders as "unknown"/0 PAR (hydrate()
// handles that already) rather than being silently dropped. Team/league ids are generated fresh
// here; teamCount is derived from however many teams are in the array (10 or 12 for this
// league's format, but the importer itself doesn't enforce that -- same permissiveness as
// createLeague()).
function importLeague(data){
  if (!data || !Array.isArray(data.teams) || !data.teams.length){
    throw new Error('Expected {name, teams: [{name, roster: [...]}]}');
  }
  const id = 'lg_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const teams = data.teams.map((t, i) => ({
    id: 't' + (i + 1),
    name: (t.name && String(t.name).trim()) || ('Team ' + (i + 1)),
    roster: Array.isArray(t.roster) ? t.roster.filter(n => typeof n === 'string' && n.trim()) : [],
  }));
  const league = { id, name: (data.name && data.name.trim()) || 'Imported League', teamCount: teams.length, teams };
  leagues.push(league);
  persistLeagues();
  activeLeagueId = id;
  teamAId = teams[0].id; teamBId = teams.length > 1 ? teams[1].id : teams[0].id;
  resetTradeState();
  newLeagueForm = false;
  importLeagueForm = false;
}

// Sleeper's league/roster/user endpoints are all public and CORS-open -- confirmed with a real
// cross-origin fetch during this build, from a page on a totally different origin, with no
// login of any kind -- so unlike ESPN this needs no bookmarklet, no extra step: paste a URL,
// fetch straight from this page, done. The one real cost is /v1/players/nfl, which Sleeper's own
// docs say is large (several MB) and shouldn't be polled frequently -- fine for an occasional,
// user-initiated "import my league" click, not fine to call on every render, so it's only ever
// fetched here, once per import.
async function importFromSleeperUrl(input){
  const m = String(input || '').match(/(\d{5,})/);
  if (!m) throw new Error('Could not find a Sleeper league ID in that URL.');
  const leagueId = m[1];

  const [league, rosters, users] = await Promise.all([
    fetch(`https://api.sleeper.app/v1/league/${leagueId}`)
      .then(r => { if (!r.ok) throw new Error('Sleeper league not found -- check the URL or ID.'); return r.json(); }),
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/rosters`).then(r => r.json()),
    fetch(`https://api.sleeper.app/v1/league/${leagueId}/users`).then(r => r.json()),
  ]);
  if (!league || !Array.isArray(rosters)) throw new Error('Sleeper league not found -- check the URL or ID.');

  const players = await fetch('https://api.sleeper.app/v1/players/nfl').then(r => r.json());
  const nameById = {};
  Object.keys(players).forEach(id => {
    const p = players[id];
    if (p && p.full_name && p.position !== 'DEF' && p.position !== 'K') nameById[id] = p.full_name;
  });

  const nameByOwner = {};
  (users || []).forEach(u => { nameByOwner[u.user_id] = (u.metadata && u.metadata.team_name) || u.display_name; });

  const teams = rosters.map((r, i) => ({
    name: nameByOwner[r.owner_id] || ('Team ' + (i + 1)),
    roster: (r.players || []).map(id => nameById[id]).filter(Boolean),
  }));
  return { name: league.name || 'Sleeper League', teams };
}

// Reads a league staged by the ESPN bookmarklet (window.open('...#import=' + encoded)) into
// pendingImport for a confirm step -- never auto-imports without the visitor seeing what it is
// first. The hash is stripped from the address bar immediately either way so a reload/share of
// the URL doesn't re-trigger it or leave a large data blob sitting in the visible address bar.
function checkHashImport(){
  if (!location.hash.startsWith('#import=')) return;
  const raw = location.hash.slice('#import='.length);
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const data = JSON.parse(decodeURIComponent(raw));
    if (data && Array.isArray(data.teams) && data.teams.length) pendingImport = data;
  } catch (e){ /* malformed hash -- silently ignore, nothing to import */ }
}

function deleteLeague(id){
  const league = leagues.find(l => l.id === id);
  if (!confirm(`Delete "${league.name}" and all its saved rosters? This can't be undone.`)) return;
  leagues = leagues.filter(l => l.id !== id);
  persistLeagues();
  activeLeagueId = 'scratch'; teamAId = 'A'; teamBId = 'B';
  resetTradeState();
}
function resetTradeState(){
  sendAway = { A: new Set(), B: new Set() };
  searchQuery = { A: '', B: '' };
  recommendations = null;
  recFocusPlayer = null;
}
function switchLeague(id){
  activeLeagueId = id;
  const league = activeLeague();
  teamAId = league.teams[0].id;
  teamBId = league.teams.length > 1 ? league.teams[1].id : league.teams[0].id;
  resetTradeState();
}
function setTeamSlot(side, teamId){
  if (side === 'A') teamAId = teamId; else teamBId = teamId;
  resetTradeState();
}

// A player can't be on both sides of the SAME proposed trade -- this only needs to hold between
// whichever two teams are currently loaded into the builder, not across the whole league (a
// player can very much sit on a third team's saved roster while you edit these two).
function takenNamesForSides(){
  return new Set([...currentTeam('A').roster, ...currentTeam('B').roster]);
}

function addPlayer(side, name){
  if (!POOL_BY_NAME.has(name)) return;
  if (takenNamesForSides().has(name)) return;
  currentTeam(side).roster.push(name);
  searchQuery[side] = '';
  if (activeLeagueId !== 'scratch') persistLeagues();
  render();
}
function removePlayer(side, name){
  const t = currentTeam(side);
  t.roster = t.roster.filter(n => n !== name);
  sendAway[side].delete(name);
  if (activeLeagueId !== 'scratch') persistLeagues();
  render();
}
function toggleSend(side, name){
  const s = sendAway[side];
  if (s.has(name)) s.delete(name); else s.add(name);
  render();
}
function renameTeam(side, newName){
  currentTeam(side).name = newName;
  if (activeLeagueId !== 'scratch') persistLeagues();
}
function applyTrade(){
  const a = currentTeam('A'), b = currentTeam('B');
  const aSend = [...sendAway.A], bSend = [...sendAway.B];
  a.roster = a.roster.filter(n => !sendAway.A.has(n)).concat(bSend);
  b.roster = b.roster.filter(n => !sendAway.B.has(n)).concat(aSend);
  resetTradeState();
  if (activeLeagueId !== 'scratch') persistLeagues();
  render();
}

function searchMatches(side){
  const q = searchQuery[side].trim().toLowerCase();
  if (!q) return [];
  const taken = takenNamesForSides();
  return POOL
    .filter(p => !taken.has(p.name) && p.name.toLowerCase().includes(q))
    .sort((a,b) => b.ros_par - a.ros_par)
    .slice(0, 8);
}

// =========================================================================================
// Trade recommendations: for a chosen team, search every OTHER team in the same league for
// 1-for-1, 2-for-1, and 1-for-2 trades (REC_SHAPES -- the agreed v1 scope; no 2-for-2+ packages,
// no multi-team trades) that (a) genuinely improve the chosen team's optimal starting lineup and
// (b) don't leave the other side clearly worse off. Both conditions fold through the SAME
// optimalLineupPAR() the manual trade grade uses, so a recommendation and a manually-built trade
// are graded identically -- there's no separate, looser scoring path for suggestions.
// =========================================================================================
const REC_SHAPES = [[1,1],[2,1],[1,2]]; // [players team sends, players team receives]
// "Fair to both" floor: the OTHER team's starting-lineup impact must stay at C+ or better
// (see GRADE_BANDS) -- i.e. a recommendation never suggests fleecing the other side, only trades
// a reasonable manager would plausibly accept. This threshold is a documented calibration
// choice, not backtested (same category as the grade bands themselves -- see HANDOFF.md).
const REC_FAIRNESS_FLOOR = -4;
const REC_MAX_PER_OPPONENT = 3; // caps how many of the results can come from one opponent, so
                                 // the top-10 list isn't just one team's roster over and over
const REC_MAX_RESULTS = 10;

function combosOf(arr, n){
  if (n === 1) return arr.map(x => [x]);
  const out = [];
  for (let i=0; i<arr.length; i++) for (let j=i+1; j<arr.length; j++) out.push([arr[i], arr[j]]);
  return out;
}

function findRecommendations(teamId, focusPlayerName){
  const league = activeLeague();
  const team = teamById(league, teamId);
  const teamPlayers = hydrate(team.roster);
  if (!teamPlayers.length) return [];
  const baselineX = optimalLineupPAR(teamPlayers);
  const all = [];

  league.teams.forEach(opp => {
    if (opp.id === teamId) return;
    const oppPlayers = hydrate(opp.roster);
    if (!oppPlayers.length) return;
    const baselineOpp = optimalLineupPAR(oppPlayers);
    const perOpp = [];

    REC_SHAPES.forEach(([giveN, getN]) => {
      if (teamPlayers.length < giveN || oppPlayers.length < getN) return;
      combosOf(teamPlayers, giveN).forEach(give => {
        // When a focus player is chosen, only consider "give" packages that include them --
        // required, but (for the 2-for-1 shape) not necessarily the only player sent. No filter
        // at all when focusPlayerName is null, which reproduces the original whole-roster search.
        if (focusPlayerName && !give.some(p => p.name === focusPlayerName)) return;
        const giveNames = new Set(give.map(p => p.name));
        const xRemaining = teamPlayers.filter(p => !giveNames.has(p.name));
        combosOf(oppPlayers, getN).forEach(get => {
          const getNames = new Set(get.map(p => p.name));
          const oppRemaining = oppPlayers.filter(p => !getNames.has(p.name));
          const deltaX = optimalLineupPAR(xRemaining.concat(get)) - baselineX;
          const deltaOpp = optimalLineupPAR(oppRemaining.concat(give)) - baselineOpp;
          if (deltaX > 0 && deltaOpp >= REC_FAIRNESS_FLOOR){
            perOpp.push({
              opponentId: opp.id, opponentName: opp.name,
              give: give.map(p => p.name), get: get.map(p => p.name), deltaX, deltaOpp,
            });
          }
        });
      });
    });

    perOpp.sort((a,b) => b.deltaX - a.deltaX);
    all.push(...perOpp.slice(0, REC_MAX_PER_OPPONENT));
  });

  all.sort((a,b) => b.deltaX - a.deltaX);
  return all.slice(0, REC_MAX_RESULTS);
}

function loadRecommendation(idx){
  const r = recommendations.results[idx];
  teamBId = r.opponentId;
  sendAway = { A: new Set(r.give), B: new Set(r.get) };
  render();
}

function summaryHTML(){
  const teamA = currentTeam('A'), teamB = currentTeam('B');
  const aRoster = hydrate(teamA.roster), bRoster = hydrate(teamB.roster);
  const aSend = aRoster.filter(p => sendAway.A.has(p.name));
  const bSend = bRoster.filter(p => sendAway.B.has(p.name));
  if (!aSend.length && !bSend.length){
    return { summary: `<div class="summary-empty"><div class="big">No trade proposed yet</div>Use the &#8644; toggle on a roster row to mark a player as sent, on either side.</div>`, method: methodologyHTML() };
  }

  const isQuickTrade = activeLeagueId === 'scratch';
  const aRawValue = sumPAR(bSend) - sumPAR(aSend);
  const bRawValue = sumPAR(aSend) - sumPAR(bSend);

  // Quick Trade only ever holds the players actually named in the trade (no full roster), so
  // optimalLineupPAR()'s empty-slot penalty would swamp the grade with noise unrelated to the
  // players involved -- Quick Trade grades on raw PAR value alone. Saved leagues hold full
  // rosters, so they keep grading on starting-lineup impact, same as before.
  let aDelta, bDelta;
  if (!isQuickTrade){
    const aAfter = aRoster.filter(p => !sendAway.A.has(p.name)).concat(bSend);
    const bAfter = bRoster.filter(p => !sendAway.B.has(p.name)).concat(aSend);
    aDelta = optimalLineupPAR(aAfter) - optimalLineupPAR(aRoster);
    bDelta = optimalLineupPAR(bAfter) - optimalLineupPAR(bRoster);
  }

  const card = (label, sent, received, rawValue, delta) => {
    const g = gradeFor(isQuickTrade ? rawValue : delta);
    return `
      <div class="grade-card">
        <div class="grade-badge ${g.cls}">${g.grade}</div>
        <div class="grade-body">
          <div class="grade-team">${esc(label)}</div>
          <div class="grade-line">Raw value change: <b>${rawValue >= 0 ? '+' : ''}${rawValue}</b> RoS PAR</div>
          ${isQuickTrade ? '' : `<div class="grade-line">Starting-lineup impact: <b>${delta >= 0 ? '+' : ''}${delta}</b> RoS PAR</div>`}
          <div class="grade-players">
            <b>Sends:</b> ${sent.length ? sent.map(p => esc(p.name)).join(', ') : '&mdash;'}<br>
            <b>Receives:</b> ${received.length ? received.map(p => esc(p.name)).join(', ') : '&mdash;'}
          </div>
        </div>
      </div>`;
  };

  const applyBtn = activeLeagueId !== 'scratch'
    ? `<div class="apply-row"><button class="reset-btn primary" data-action="applyTrade">Apply this trade to the saved rosters</button></div>`
    : '';

  const summary = `<div class="grade-grid">
      ${card(teamA.name, aSend, bSend, aRawValue, aDelta)}
      ${card(teamB.name, bSend, aSend, bRawValue, bDelta)}
    </div>${applyBtn}`;
  return { summary, method: methodologyHTML(isQuickTrade) };
}

function methodologyHTML(isQuickTrade){
  if (isQuickTrade){
    return `
      <p><b>How the grade works:</b> Quick Trade compares the players you've added directly, value
      for value &mdash; each side's rest-of-season PAR (points above a replacement-level player, for
      the games left this season) received minus what it gives up. There's no full roster here, so
      there's no starting-lineup calculation to fold in &mdash; just the players actually changing
      hands. Create a league to build full rosters and get starting-lineup-based grades and trade
      recommendations.</p>`;
  }
  return `
    <p><b>How the grade works:</b> "Raw value change" is just the rest-of-season PAR (points above a
    replacement-level player, for the games left this season) each side gains minus what it gives
    up. "Starting-lineup impact" is the better read on whether the trade actually helps &mdash; it's
    the change in that team's optimal 1QB/2RB/2WR/1TE/2FLEX starting lineup value, so it naturally
    rewards fixing a real starting hole and discounts a trade that only adds bench depth behind an
    already-strong position. The letter grade is based on starting-lineup impact, not raw value.</p>
    <p><b>How recommendations work:</b> for a chosen team, every other team in the league is checked
    for 1-for-1, 2-for-1, and 1-for-2 combinations. A trade is only suggested if it's a genuine
    starting-lineup improvement for your team AND the other team's own starting-lineup impact
    doesn't drop below a C+ &mdash; so recommendations should be ones the other side would plausibly
    say yes to, not lopsided offers. Ranked by how much they help your team, most helpful first.
    Optionally focus the search on one player to only see trades that send that player away.</p>`;
}

  const league = activeLeague();

  const focusOpts = teamARoster.slice().sort((a,b) => b.ros_par - a.ros_par).map(p =>

  const hint = recFocusPlayer
    ? `Checks every other team in ${esc(league.name)} for trades that send <b>${esc(recFocusPlayer)}</b> away
       and improve ${esc(teamA.name)}'s starting lineup while staying fair to the other side.`
    : `Checks every other team in ${esc(league.name)} for 1-for-1 and 2-for-1 (or 1-for-2)
       trades that improve ${esc(teamA.name)}'s starting lineup while staying fair to the other side.`;
  return `
    <div class="rec-panel">
      <div class="rec-head">
        <div class="summary-title" style="margin:0;">Trade recommendations for ${esc(teamA.name)}</div>
        <button class="reset-btn small primary" data-action="findRecs">Find trades</button>
      </div>
      <div class="rec-focus-row">
        <label for="recFocusSelect">Focus on a player</label>
        <select id="recFocusSelect">
          <option value="">Any player</option>
          ${focusOpts}
        </select>
      </div>
      <div class="rec-hint">${hint} Switch which team is "Team A" above to get recommendations for a different team.</div>
      <div id="recResults">${showResults ? recResultsHTML() : ''}</div>
    </div>`;
}
function recResultsHTML(){
  const results = recommendations.results;
  if (!results.length){
    return `<div class="summary-empty">No fair, team-improving trades found in this league right now.</div>`;
  }
  return results.map((r, i) => `
    <div class="rec-card">
      <div class="rec-card-head">
        <span class="grade-badge small ${gradeFor(r.deltaX).cls}">${gradeFor(r.deltaX).grade}</span>
        <div>
          <div class="rec-opp">vs. ${esc(r.opponentName)}</div>
          <div class="rec-lines">Sends: ${r.give.map(esc).join(', ')} &rarr; Receives: ${r.get.map(esc).join(', ')}</div>
          <div class="rec-lines">Your impact: <b>${r.deltaX>=0?'+':''}${r.deltaX}</b> &middot; Their impact: <b>${r.deltaOpp>=0?'+':''}${r.deltaOpp}</b></div>
        </div>
      </div>
      <button class="reset-btn small" data-action="loadRec" data-idx="${i}">Load into builder</button>
    </div>`).join('');
}

function sumPAR(list){ return list.reduce((s,p) => s + p.ros_par, 0); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s){ return esc(s).replace(/'/g, '&#39;'); }

function pendingImportBannerHTML(){
  if (!pendingImport) return '';
  return `
    <div class="pending-import-banner">
      <div class="pib-text">Found a league from the link you opened: <b>${esc(pendingImport.name)}</b>
        (${pendingImport.teams.length} teams). Import it?</div>
      <button class="reset-btn small primary" data-action="confirmPendingImport">Import</button>
      <button class="reset-btn small" data-action="discardPendingImport">Discard</button>
    </div>`;
}

function render(){
  document.getElementById('pendingImportBanner').innerHTML = pendingImportBannerHTML();
  document.getElementById('leagueBar').innerHTML = leagueBarHTML();
  document.getElementById('teamSelectors').innerHTML = teamSelectorsHTML();
  document.getElementById('panelA').innerHTML = panelHTML('A');
  document.getElementById('panelB').innerHTML = panelHTML('B');
  const { summary, method } = summaryHTML();
  document.getElementById('summaryOut').innerHTML = summary;
  document.getElementById('methodology').innerHTML = method;
  document.getElementById('recPanel').innerHTML = recPanelHTML();
  document.getElementById('subtitle').textContent =
    activeLeagueId === 'scratch'
      ? `Quick, value-for-value two-team mode. Values refreshed: ${ROS_REFRESH_LABEL}.`
      : `Editing ${activeLeague().name}. Values refreshed: ${ROS_REFRESH_LABEL}.`;
}

document.body.addEventListener('input', e => {
  if (e.target.classList.contains('team-search')){
    searchQuery[e.target.dataset.side] = e.target.value;
    render();
    const el = document.querySelector(`.team-search[data-side="${e.target.dataset.side}"]`);
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  if (e.target.classList.contains('team-name-input')){
    const side = e.target.dataset.side;
    renameTeam(side, e.target.value);
    render();
    const el = document.querySelector(`.team-name-input[data-side="${side}"]`);
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
});

document.body.addEventListener('change', e => {
  if (e.target.id === 'leagueSelect'){ switchLeague(e.target.value); render(); }
  if (e.target.id === 'teamASelect'){ setTeamSlot('A', e.target.value); render(); }
  if (e.target.id === 'teamBSelect'){ setTeamSlot('B', e.target.value); render(); }
  if (e.target.id === 'recFocusSelect'){
    recFocusPlayer = e.target.value || null;
    recommendations = null;
    render();
  }
});

document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const { side, action, name, idx } = t.dataset;
  if (action === 'add') addPlayer(side, name);
  if (action === 'remove') removePlayer(side, name);
  if (action === 'toggle') toggleSend(side, name);
  if (action === 'applyTrade') applyTrade();
  if (action === 'newLeague'){ newLeagueForm = true; importLeagueForm = false; render(); }
  if (action === 'cancelNewLeague'){ newLeagueForm = false; render(); }
  if (action === 'deleteLeague') { deleteLeague(activeLeagueId); render(); }
  if (action === 'createLeague'){
    const name = document.getElementById('nlName').value;
    const size = parseInt(document.getElementById('nlSize').value, 10);
    createLeague(name, size);
    render();
  }
  if (action === 'importLeague'){ importLeagueForm = true; newLeagueForm = false; render(); }
  if (action === 'cancelImportLeague'){ importLeagueForm = false; render(); }
  if (action === 'doImportLeague'){
    const raw = document.getElementById('ilJson').value;
    const errEl = document.getElementById('ilError');
    try {
      const data = JSON.parse(raw);
      importLeague(data);
      render();
    } catch (e){
      errEl.textContent = 'Could not import: ' + e.message;
      errEl.style.display = 'block';
    }
  }
  if (action === 'findRecs'){
    document.getElementById('recResults').innerHTML = `<div class="summary-empty">Searching every matchup&hellip;</div>`;
    setTimeout(() => {
      recommendations = { forTeamId: teamAId, results: findRecommendations(teamAId, recFocusPlayer) };
      render();
    }, 20);
  }
  if (action === 'loadRec') loadRecommendation(parseInt(idx, 10));
  if (action === 'doImportSleeper'){
    if (sleeperImporting) return;
    const input = document.getElementById('ilSleeperUrl').value;
    const errEl = document.getElementById('ilSleeperError');
    errEl.style.display = 'none';
    sleeperImporting = true;
    t.textContent = 'Importing…';
    importFromSleeperUrl(input).then(data => {
      sleeperImporting = false;
      importLeague(data);
      render();
    }).catch(e => {
      sleeperImporting = false;
      errEl.textContent = 'Could not import: ' + e.message;
      errEl.style.display = 'block';
      render();
    });
  }
  if (action === 'confirmPendingImport'){
    const data = pendingImport;
    pendingImport = null;
    importLeague(data);
    render();
  }
  if (action === 'discardPendingImport'){ pendingImport = null; render(); }
});

checkHashImport();
render();
</script>
</body>
</html>
